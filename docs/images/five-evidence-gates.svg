  <g>
    <rect x="1000" y="620" width="378" height="164" rx="18" fill="#11130b" fill-opacity="0.88" stroke="#f2ce3d" stroke-width="2.5" stroke-dasharray="9 8"/>
    <circle cx="1060" cy="674" r="36" fill="#1f1c08" stroke="#f6d64b" stroke-width="2"/>
    <path d="M1060 646 V700 M1039 660 H1081 M1045 660 L1032 686 H1058 Z M1075 660 L1062 686 H1088 Z" fill="none" stroke="#f6d64b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1116" y="666" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="900" fill="#f6d64b">RULE</text>
    <text x="1116" y="704" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#f5f5f1"><tspan x="1116">READY = every required</tspan><tspan x="1116" dy="25">gate is satisfied AND no</tspan><tspan x="1116" dy="25">blocking counterevidence</tspan><tspan x="1116" dy="25">remains unresolved</tspan></text>
  </g>

  <g>
