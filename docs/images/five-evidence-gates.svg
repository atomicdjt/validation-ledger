    <path d="M90 777 L120 833 H60 Z" fill="none" stroke="#ff8a70" stroke-width="4" stroke-linejoin="round"/><line x1="90" y1="794" x2="90" y2="814" stroke="#ff8a70" stroke-width="5" stroke-linecap="round"/><circle cx="90" cy="824" r="3" fill="#ff8a70"/>
    <text x="150" y="797" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="900" fill="#fff">Counterevidence</text>
    <text x="150" y="835" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#f4e9e6"><tspan x="150">Blocking defects, failed checks,</tspan><tspan x="150" dy="25">unresolved review, contradictory</tspan><tspan x="150" dy="25">findings</tspan></text>
  </g>

