    <circle cx="110" cy="0" r="28" fill="#0b4d2a" stroke="#8affb0" stroke-width="2.5"/><text x="110" y="10" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" fill="#fff">2</text>
    <rect x="74" y="51" width="72" height="90" rx="8" fill="none" stroke="#75f39f" stroke-width="4"/><path d="M88 74 l8 8 15 -17 M88 99 l8 8 15 -17 M88 124 l8 8 15 -17" fill="none" stroke="#75f39f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="116" y1="79" x2="135" y2="79" stroke="#75f39f" stroke-width="4"/><line x1="116" y1="104" x2="135" y2="104" stroke="#75f39f" stroke-width="4"/><line x1="116" y1="129" x2="135" y2="129" stroke="#75f39f" stroke-width="4"/>
    <text x="110" y="166" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff"><tspan x="110">Automated</tspan><tspan x="110" dy="26">Verification</tspan></text>
    <line x1="75" y1="214" x2="145" y2="214" stroke="#48e787" stroke-width="2"/>
    <text x="110" y="247" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#e8f0f4"><tspan x="110">Tests, type checks,</tspan><tspan x="110" dy="23">linting, and machine-</tspan><tspan x="110" dy="23">checkable rules</tspan><tspan x="110" dy="23">passed</tspan></text>
    <circle cx="110" cy="337" r="25" fill="#239653" stroke="#8affb0" stroke-width="2"/><path d="M98 337 L107 346 L124 326" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

