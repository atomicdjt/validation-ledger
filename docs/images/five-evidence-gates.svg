    <circle cx="110" cy="0" r="28" fill="#0b4d2a" stroke="#8affb0" stroke-width="2.5"/><text x="110" y="10" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" fill="#fff">3</text>
    <rect x="63" y="58" width="94" height="67" rx="7" fill="none" stroke="#75f39f" stroke-width="4"/><path d="M77 96 H91 L99 82 L108 109 L119 73 L128 96 H145" fill="none" stroke="#75f39f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="110" y1="125" x2="110" y2="141" stroke="#75f39f" stroke-width="4"/><line x1="88" y1="141" x2="132" y2="141" stroke="#75f39f" stroke-width="4"/>
    <text x="110" y="166" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff"><tspan x="110">Runtime</tspan><tspan x="110" dy="26">Verification</tspan></text>
    <line x1="75" y1="214" x2="145" y2="214" stroke="#48e787" stroke-width="2"/>
    <text x="110" y="251" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#e8f0f4"><tspan x="110">The behavior was</tspan><tspan x="110" dy="25">observed in a</tspan><tspan x="110" dy="25">running system</tspan></text>
    <circle cx="110" cy="337" r="25" fill="#239653" stroke="#8affb0" stroke-width="2"/><path d="M98 337 L107 346 L124 326" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(870,170)">
    <rect width="220" height="365" rx="22" fill="url(#greenPanel)" stroke="#83f6a9" stroke-width="2.5"/>
    <circle cx="110" cy="0" r="28" fill="#0b4d2a" stroke="#8affb0" stroke-width="2.5"/><text x="110" y="10" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" fill="#fff">4</text>
    <circle cx="110" cy="95" r="46" fill="none" stroke="#75f39f" stroke-width="4"/><ellipse cx="110" cy="95" rx="22" ry="46" fill="none" stroke="#75f39f" stroke-width="3"/><line x1="64" y1="95" x2="156" y2="95" stroke="#75f39f" stroke-width="3"/><path d="M71 75 Q110 91 149 75 M71 115 Q110 99 149 115" fill="none" stroke="#75f39f" stroke-width="3"/>
    <text x="110" y="166" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff"><tspan x="110">Production</tspan><tspan x="110" dy="26">Verification</tspan></text>
    <line x1="75" y1="214" x2="145" y2="214" stroke="#48e787" stroke-width="2"/>
    <text x="110" y="249" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17.5" fill="#e8f0f4"><tspan x="110">The version users</tspan><tspan x="110" dy="24">can actually reach</tspan><tspan x="110" dy="24">was verified</tspan></text>
    <circle cx="110" cy="337" r="25" fill="#239653" stroke="#8affb0" stroke-width="2"/><path d="M98 337 L107 346 L124 326" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(1150,170)">
