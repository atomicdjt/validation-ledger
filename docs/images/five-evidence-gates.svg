  <circle cx="708" cy="848" r="31" fill="#6d1510" stroke="#ff6a59" stroke-width="3"/><path d="M696 836 L720 860 M720 836 L696 860" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
