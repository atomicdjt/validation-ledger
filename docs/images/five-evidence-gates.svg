<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc">
  <title id="title">Five Evidence Gates</title>
  <desc id="desc">A technical diagram showing five evidence gates—Implementation, Automated Verification, Runtime Verification, Production Verification, and Human Verification—feeding into Ready, while blocking counterevidence can veto readiness. Unknown is not Pass.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111c"/><stop offset="0.55" stop-color="#07101a"/><stop offset="1" stop-color="#03070d"/></linearGradient>
    <linearGradient id="greenPanel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#082319" stop-opacity="0.78"/><stop offset="1" stop-color="#06140f" stop-opacity="0.92"/></linearGradient>
    <linearGradient id="readyPanel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#083a2b"/><stop offset="1" stop-color="#071b15"/></linearGradient>
    <linearGradient id="redPanel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a0c0a"/><stop offset="1" stop-color="#130707"/></linearGradient>
    <linearGradient id="bluePanel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1e35"/><stop offset="1" stop-color="#07111e"/></linearGradient>
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowRed" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#2a6f9a" opacity="0.13"/></pattern>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#71f7a5"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ff604f"/></marker>
  </defs>

  <rect width="1448" height="1086" fill="url(#bg)"/>
  <rect width="1448" height="1086" fill="url(#dots)"/>
  <path d="M0 78 H42 L82 38 H150" fill="none" stroke="#2d9bc6" stroke-opacity="0.38" stroke-width="2"/>
  <circle cx="175" cy="38" r="4" fill="#4ec9ff" filter="url(#glowGreen)"/>
  <path d="M1448 78 H1406 L1366 38 H1298" fill="none" stroke="#2d9bc6" stroke-opacity="0.38" stroke-width="2"/>
  <circle cx="1273" cy="38" r="4" fill="#4ec9ff" filter="url(#glowGreen)"/>

  <text x="724" y="83" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="72" font-weight="800" letter-spacing="-2" fill="#f8fbff">Five Evidence Gates</text>
  <text x="724" y="127" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="500" fill="#c7d6e3">How completion claims should be validated in AI-assisted software work</text>

  <g stroke="#71f7a5" stroke-width="4" fill="none" opacity="0.95" marker-end="url(#arrowGreen)">
    <path d="M250 347 H292"/><path d="M530 347 H572"/><path d="M810 347 H852"/><path d="M1090 347 H1132"/>
  </g>

