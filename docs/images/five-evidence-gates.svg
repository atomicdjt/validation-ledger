  <text x="975" y="856" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="900" fill="#ff6b59">VETO: Counterevidence overrides READY</text>
  <path d="M1208 848 H1384" stroke="#ff604f" stroke-width="4" stroke-dasharray="12 10"/>

  <g>
