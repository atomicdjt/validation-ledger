    <circle cx="110" cy="0" r="28" fill="#0b4d2a" stroke="#8affb0" stroke-width="2.5"/><text x="110" y="10" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" fill="#fff">5</text>
    <circle cx="110" cy="95" r="46" fill="none" stroke="#75f39f" stroke-width="4"/><circle cx="110" cy="80" r="15" fill="none" stroke="#75f39f" stroke-width="4"/><path d="M82 126 Q87 101 110 101 Q133 101 138 126" fill="none" stroke="#75f39f" stroke-width="4" stroke-linecap="round"/>
    <text x="110" y="166" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff"><tspan x="110">Human</tspan><tspan x="110" dy="26">Verification</tspan></text>
    <line x1="75" y1="214" x2="145" y2="214" stroke="#48e787" stroke-width="2"/>
    <text x="110" y="249" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17.5" fill="#e8f0f4"><tspan x="110">A required human</tspan><tspan x="110" dy="24">review or judgment</tspan><tspan x="110" dy="24">was completed</tspan></text>
    <circle cx="110" cy="337" r="25" fill="#239653" stroke="#8affb0" stroke-width="2"/><path d="M98 337 L107 346 L124 326" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g stroke="#71f7a5" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.92">
    <path d="M140 507 V568 H700"/><path d="M420 507 V568"/><path d="M700 507 V606" marker-end="url(#arrowGreen)"/><path d="M980 507 V568"/><path d="M1260 507 V568 H700"/>
  </g>

  <g>
    <rect x="500" y="610" width="430" height="176" rx="24" fill="url(#readyPanel)" stroke="#50f39a" stroke-width="3" filter="url(#glowGreen)"/>
    <circle cx="566" cy="698" r="46" fill="#0c3c2a" stroke="#91ffc0" stroke-width="3"/>
    <path d="M566 659 L596 672 V696 C596 718 583 735 566 745 C549 735 536 718 536 696 V672 Z" fill="none" stroke="#f2fff7" stroke-width="5"/><path d="M551 698 L563 710 L584 684" fill="none" stroke="#f2fff7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="734" y="706" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="66" font-weight="900" fill="#fff">READY</text>
    <line x1="650" y1="726" x2="858" y2="726" stroke="#4ff59a" stroke-width="2"/>
    <text x="754" y="758" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#8ef7b4">All required gates satisfied</text>
