    <circle cx="110" cy="0" r="28" fill="#0b4d2a" stroke="#8affb0" stroke-width="2.5"/><text x="110" y="10" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" fill="#fff">1</text>
    <circle cx="110" cy="95" r="47" fill="none" stroke="#75f39f" stroke-width="4"/>
    <path d="M94 80 L76 95 L94 110 M126 80 L144 95 L126 110 M116 71 L104 119" fill="none" stroke="#75f39f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="110" y="166" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" fill="#fff">Implementation</text>
    <line x1="75" y1="188" x2="145" y2="188" stroke="#48e787" stroke-width="2"/>
    <text x="110" y="228" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#e8f0f4"><tspan x="110">The requested</tspan><tspan x="110" dy="26">change exists in</tspan><tspan x="110" dy="26">the codebase</tspan></text>
    <circle cx="110" cy="337" r="25" fill="#239653" stroke="#8affb0" stroke-width="2"/><path d="M98 337 L107 346 L124 326" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

